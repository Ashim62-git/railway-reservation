spring.application.name=RailwayReservationSystem

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/railway_reservation
spring.datasource.username=postgres
spring.datasource.password=password

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080

# Disable Devtools Restart to prevent ClassLoader introspection conflicts in VS Code
spring.devtools.restart.enabled=false
spring.jpa.open-in-view=false